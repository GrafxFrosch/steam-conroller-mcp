[project]
name = "steam-claude-controller"
version = "0.1.0"
description = "MCP server that lets Claude see and play Steam games on Windows (generic input + Source engine adapter)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pillow>=10.0",
]

[project.scripts]
steam-claude-controller = "steam_claude_controller.server:main"
scc = "steam_claude_controller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_claude_controller"]
